<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Carlos Capin — graphic artist and marketing management creative portfolio."
    >
    <meta name="theme-color" content="#0d0e0d">
    <title>Carlos Capin — Graphic Artist</title>
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="stylesheet" href="static/css/main.css">
    <script src="static/js/drive-config.js" defer></script>
    <script src="static/js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="masthead" aria-label="Portfolio heading">
      <p class="masthead__brand">Visual artist</p>
      <p class="masthead__statement">Creative works &amp; visual journey</p>
      <p class="masthead__year" data-current-year>2026</p>
    </header>

    <main id="main-content">
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="hero__art" aria-hidden="true">
          <div class="hero__drive-background" id="hero-background"></div>
          <div class="hero__grain"></div>
          <div class="hero__arch hero__arch--one"></div>
          <div class="hero__arch hero__arch--two"></div>
          <div class="hero__shadow"></div>
        </div>

        <div class="hero__copy">
          <h1 class="hero__title" id="hero-title">
            <span>Graphic</span>
            <span>Artist</span>
          </h1>
          <p class="hero__discipline">Marketing Management</p>
        </div>

        <figure class="portrait-card" id="portrait-card">
          <span class="portrait-card__tape" aria-hidden="true"></span>
          <div class="portrait-card__media">
            <img id="hero-portrait" alt="Portrait of Carlos Capin" hidden>
            <div class="portrait-card__placeholder" id="portrait-placeholder" aria-hidden="true">
              <img src="static/media/fallback/carlos-portrait-placeholder.svg" alt="">
            </div>
          </div>
          <figcaption>
            <span class="portrait-card__name">Carlos Capin</span>
            <span class="portrait-card__label">Artist Portfolio</span>
          </figcaption>
        </figure>

        <svg
          class="hero__folder"
          viewBox="0 0 464 160"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M0 0H66Q73 0 79 7L151 86Q158 94 169 94H447Q464 94 464 111V160H0Z" />
        </svg>
      </section>
    </main>

    <nav class="icon-dock" id="icon-dock" aria-label="Portfolio navigation">
      <div class="icon-dock__items">
        <button class="icon-dock__item" type="button" data-dock-view="Home" aria-label="Home" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg>
          <span>Home</span>
        </button>
        <button class="icon-dock__item" type="button" data-dock-view="About" aria-label="About" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5.5 21c.4-5.1 2.6-7.7 6.5-7.7s6.1 2.6 6.5 7.7"/></svg>
          <span>About</span>
        </button>
        <button class="icon-dock__item" type="button" data-dock-view="Work" aria-label="Selected work" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>Work</span>
        </button>
        <button class="icon-dock__item" type="button" data-dock-view="Skills" aria-label="Skills and services" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 20-7.6-7.2a5.1 5.1 0 0 1 7.2-7.2l.4.4.4-.4a5.1 5.1 0 0 1 7.2 7.2ZM8.3 9.1l2.2 2.1 4.2-4"/></svg>
          <span>Skills</span>
        </button>
        <button class="icon-dock__item" type="button" data-dock-view="Experience" aria-label="Experience" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM9 8V5h6v3M4 12h16M10 12v2h4v-2"/></svg>
          <span>Experience</span>
        </button>
        <button class="icon-dock__item" type="button" data-dock-view="Contact" aria-label="Contact" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H11l-5 3v-3H4z"/></svg>
          <span>Contact</span>
        </button>
      </div>

      <button
        class="icon-dock__minimize"
        id="icon-dock-minimize"
        type="button"
        aria-label="Minimize portfolio navigation"
        aria-controls="icon-dock"
        aria-expanded="true"
        aria-hidden="true"
        disabled
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v10h10M6.5 17.5 18 6"/><path d="M12 6h6v6"/></svg>
      </button>
    </nav>

    <button
      class="icon-dock__restore"
      id="icon-dock-restore"
      type="button"
      aria-label="Expand portfolio navigation"
      aria-controls="icon-dock"
      aria-expanded="false"
      aria-hidden="true"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg>
    </button>
    <p class="visually-hidden" id="icon-dock-status" aria-live="polite">Home selected</p>

    <noscript>
      <p class="noscript-note">Please enable JavaScript to load Carlos&rsquo; Drive-powered hero media.</p>
    </noscript>
  </body>
</html>
