<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Carlos Capin — graphic artist and marketing management creative portfolio."
    >
    <meta name="theme-color" content="#0d0e0d">
    <title>Carlos Capin — Graphic Artist</title>
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="stylesheet" href="static/css/main.css">
    <script src="static/js/drive-config.js" defer></script>
    <script src="static/js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="portfolio-header">
      <nav class="portfolio-nav" aria-label="Portfolio files">
        <a class="portfolio-nav__identity" href="#home" aria-label="Carlos Capin portfolio cover">
          <span class="portfolio-nav__monogram" aria-hidden="true">CC</span>
          <span>
            <strong>Carlos Capin</strong>
            <small>Visual portfolio</small>
          </span>
        </a>

        <div class="portfolio-nav__tabs" id="portfolio-nav-panel">
          <div class="portfolio-nav__drawer-head">
            <p><span>Portfolio index</span><strong>Files 01—05</strong></p>
            <button class="portfolio-nav__close" id="portfolio-nav-close" type="button" aria-label="Close portfolio index">×</button>
          </div>

          <a class="file-tab file-tab--active" href="#home" aria-current="page">
            <span class="file-tab__number">01</span>
            <span class="file-tab__label">Cover</span>
            <small>Open file</small>
          </a>
          <span class="file-tab file-tab--profile" aria-disabled="true">
            <span class="file-tab__number">02</span>
            <span class="file-tab__label">Profile</span>
            <small>Next file</small>
          </span>
          <span class="file-tab file-tab--work" aria-disabled="true">
            <span class="file-tab__number">03</span>
            <span class="file-tab__label">Selected work</span>
            <small>Next file</small>
          </span>
          <span class="file-tab file-tab--records" aria-disabled="true">
            <span class="file-tab__number">04</span>
            <span class="file-tab__label">Records</span>
            <small>Next file</small>
          </span>
          <span class="file-tab file-tab--contact" aria-disabled="true">
            <span class="file-tab__number">05</span>
            <span class="file-tab__label">Contact</span>
            <small>Next file</small>
          </span>
        </div>

        <p class="portfolio-nav__meta">
          <span>Current file</span>
          <strong>01 / <span data-current-year>2026</span></strong>
        </p>

        <button
          class="portfolio-nav__menu"
          id="portfolio-nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="portfolio-nav-panel"
        >
          <span class="portfolio-nav__menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Index</span>
        </button>
      </nav>
    </header>

    <button class="portfolio-nav__backdrop" id="portfolio-nav-backdrop" type="button" aria-label="Close portfolio index" tabindex="-1"></button>

    <main id="main-content">
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="hero__art" aria-hidden="true">
          <div class="hero__drive-background" id="hero-background"></div>
          <div class="hero__grain"></div>
          <div class="hero__arch hero__arch--one"></div>
          <div class="hero__arch hero__arch--two"></div>
          <div class="hero__shadow"></div>
        </div>

        <div class="hero__copy">
          <p class="hero__kicker">Carlos Capin · Portfolio <span data-current-year>2026</span></p>
          <h1 class="hero__title" id="hero-title">
            <span>Graphic</span>
            <span>Artist</span>
          </h1>
          <p class="hero__discipline">Marketing Management</p>
        </div>

        <figure class="portrait-card" id="portrait-card">
          <span class="portrait-card__tape" aria-hidden="true"></span>
          <div class="portrait-card__media">
            <img id="hero-portrait" alt="Portrait of Carlos Capin" hidden>
            <div class="portrait-card__placeholder" id="portrait-placeholder" aria-hidden="true">
              <img src="static/media/fallback/carlos-portrait-placeholder.svg" alt="">
            </div>
          </div>
          <figcaption>
            <span class="portrait-card__script">Artist Portfolio</span>
            <span class="portrait-card__name">Carlos Capin</span>
          </figcaption>
        </figure>

        <p class="hero__folio" aria-hidden="true">(01)</p>
      </section>
    </main>

    <noscript>
      <p class="noscript-note">Please enable JavaScript to load Carlos&rsquo; Drive-powered hero media.</p>
    </noscript>
  </body>
</html>
